<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <!-- PERFORMANCE HINTS -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.google.com">
  <title>Heart – Show/Hide Labels (Sheet-driven)</title>

  <style>
    body {
      <div id="sr-status" aria-live="polite" class="sr-only"></div>
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      margin: 1.5rem;
      background: #ffffff;
    }

    .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    border: 0;
    }


    .diagram-wrap {
      border: 1px solid #ccc;
      padding: 1rem;
      border-radius: .75rem;
      background: #fafafa;
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.25rem;
      margin-top: 0;
    }

    #label-instructions {
      font-size: 0.95rem;
      color: #374151;
      margin-bottom: 0.75rem;
    }

    .toggles {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .toggles button {
      padding: 0.4rem 0.6rem;
      border-radius: 0.4rem;
      border: 1px solid #bbb;
      background: #ffffff;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .toggles button[aria-pressed="true"] {
      background: #e8e8e8;
      font-weight: 600;
    }

    .toggles button:focus-visible {
      outline: 2px solid #2563eb;
      outline-offset: 2px;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .is-hidden {
      display: none;
    }

    .label-bg {
      fill: white;
      stroke: #000;
      stroke-width: 1;
    }

    .label {
      font-family: system-ui, sans-serif;
      font-weight: 600;
    }

    #loading-message {
    font-size: 0.9rem;
    color: #6b7280; /* subtle gray */
    animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
    0%   { opacity: 0.4; }
    50%  { opacity: 1; }
    100% { opacity: 0.4; }
    }

  </style>
</head>
<body>
  <main class="diagram-wrap">
    <h1>Heart – Show/Hide Labels</h1>

    <p id="label-instructions">
      Use the buttons below to show or hide labels on the diagram. Each button controls
      a label with the same name inside the heart illustration.
    </p>

    <!-- Buttons will be auto-generated here -->
    <div class="toggles"
         role="toolbar"
         aria-label="Heart label toggles"
         aria-describedby="label-instructions">
        <span id="loading-message">Loading labels…</span>
         </div>



  </main>

 <script>
  document.addEventListener('DOMContentLoaded', async function () {
    const svg = document.querySelector('svg');
    const toolbar = document.querySelector('.toggles');
    const loadingMsg = document.getElementById('loading-message');
    const srStatus = document.getElementById('sr-status');

    if (!svg || !toolbar) {
      if (toolbar) toolbar.textContent = 'No SVG found on this page.';
      return;
    }

    // --- CONFIG: your Apps Script URL + language + diagram id ---
    const SHEET_API_URL = 'https://script.google.com/a/macros/macmillan.com/s/AKfycbza6NpSkAnwtmqbnnITKm5wnLdf0vkNIzQKEK8n0mqfEN2PgN5j2JMBTXY1h04QQPg1Rg/exec'; // <-- paste your URL
    const LANG = 'en';
    const DIAGRAM_ID = 'heart';

    // 1) Collect label groups from SVG
    const labelEls = Array.from(svg.querySelectorAll('[id^="Label_"]'));
    if (!labelEls.length) {
      toolbar.textContent = 'No Label_* groups found in this SVG.';
      return;
    }

    // 2) Fetch labels + meta from Google Sheets
    let labelsPayload = { meta: { title: '', desc: '' }, labels: [] };
    try {
      const url = `${SHEET_API_URL}?lang=${encodeURIComponent(LANG)}&diagram=${encodeURIComponent(DIAGRAM_ID)}`;
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      labelsPayload = await res.json();
    } catch (err) {
      console.error('Failed to load label data from Sheet:', err);
      // If fetch fails, we leave labelsPayload as the default
    }

    const meta = labelsPayload.meta || { title: '', desc: '' };
    const labelData = Array.isArray(labelsPayload.labels) ? labelsPayload.labels : [];

    // 3) Apply meta: role="img", title/desc, aria-labelledby
    svg.setAttribute('role', 'img');

    // Ensure <title> and <desc> exist
    let titleEl = svg.querySelector('title');
    let descEl  = svg.querySelector('desc');

    if (!titleEl) {
      titleEl = document.createElementNS('http://www.w3.org/2000/svg', 'title');
      titleEl.id = 'diagram-title';
      svg.insertBefore(titleEl, svg.firstChild);
    } else if (!titleEl.id) {
      titleEl.id = 'diagram-title';
    }

    if (!descEl) {
      descEl = document.createElementNS('http://www.w3.org/2000/svg', 'desc');
      descEl.id = 'diagram-desc';
      svg.insertBefore(descEl, titleEl.nextSibling);
    } else if (!descEl.id) {
      descEl.id = 'diagram-desc';
    }

    if (meta.title) titleEl.textContent = meta.title;
    if (meta.desc)  descEl.textContent = meta.desc;

    svg.setAttribute('aria-labelledby', `${titleEl.id} ${descEl.id}`);

    // 4) Index label data by id
    const dataById = {};
    labelData.forEach(item => {
      if (item.id) dataById[item.id] = item;
    });

    // 5) Apply text / tooltip / initial visibility from Sheet
    labelEls.forEach(el => {
      const info = dataById[el.id];
      if (!info) return; // if no row, leave SVG as-is

      // Multi-line support via newlines in the Sheet
      const textNode = el.querySelector('text');
      if (textNode && info.text) {
        while (textNode.firstChild) {
          textNode.removeChild(textNode.firstChild);
        }

        const lines = String(info.text).split(/\r?\n/);
        lines.forEach((line, index) => {
          const tspan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
          tspan.textContent = line;

          if (index === 0) {
            tspan.setAttribute('x', textNode.getAttribute('x') || '0');
            tspan.setAttribute('y', textNode.getAttribute('y') || '0');
          } else {
            tspan.setAttribute('x', textNode.getAttribute('x') || '0');
            tspan.setAttribute('dy', '1em');
          }
          textNode.appendChild(tspan);
        });
      }

      if (info.tooltip) {
        el.setAttribute('aria-label', info.tooltip);
        el.setAttribute('title', info.tooltip);
      }

      if (info.visible === false) {
        el.classList.add('is-hidden');
      } else {
        el.classList.remove('is-hidden');
      }
    });

    // 6) Randomize label order for buttons
    const shuffledLabels = [...labelEls];
    for (let i = shuffledLabels.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffledLabels[i], shuffledLabels[j]] = [shuffledLabels[j], shuffledLabels[i]];
    }

    const buttons = [];

    // 🔹 Remove loading message now that we're about to render controls
    if (loadingMsg) {
      loadingMsg.remove();
    }

    // 7) Build buttons
    shuffledLabels.forEach(el => {
      const id = el.id;
      const info = dataById[id];
      const fallbackName = id.replace(/^Label_/, '').replace(/_/g, ' ');
      const name = info && info.text ? info.text.replace(/\r?\n/g, ' ') : fallbackName;

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.target = id;
      btn.setAttribute('aria-controls', id);

      const isHidden = el.classList.contains('is-hidden');
      btn.setAttribute('aria-pressed', isHidden ? 'false' : 'true');
      btn.textContent = name;

      toolbar.appendChild(btn);
      buttons.push(btn);
    });

    // 8) Toggle all
    const allButton = document.createElement('button');
    allButton.type = 'button';
    allButton.id = 'toggle-all';
    allButton.textContent = 'Toggle All';
    allButton.setAttribute('aria-pressed', 'false');
    toolbar.appendChild(allButton);

    function toggle(id) {
      const el = svg.querySelector('#' + CSS.escape(id));
      if (!el) return;
      const hidden = el.classList.toggle('is-hidden');
      const btn = buttons.find(b => b.dataset.target === id);
      if (btn) btn.setAttribute('aria-pressed', hidden ? 'false' : 'true');
    }

    buttons.forEach(btn => {
      btn.addEventListener('click', () => toggle(btn.dataset.target));
    });

    allButton.addEventListener('click', () => {
      const anyVisible = labelEls.some(el => !el.classList.contains('is-hidden'));
      labelEls.forEach(el => el.classList.toggle('is-hidden', anyVisible));
      buttons.forEach(b => b.setAttribute('aria-pressed', anyVisible ? 'false' : 'true'));
      allButton.setAttribute('aria-pressed', anyVisible ? 'false' : 'true');
    });

    // 🔹 Announce "ready" for screen readers
    if (srStatus) {
      srStatus.textContent = 'Labels loaded and ready.';
    }
  });
</script>

</body>
</html>
