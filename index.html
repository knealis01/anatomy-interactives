<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <!-- PERFORMANCE HINTS -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.google.com">
  <title>Interactive Scientific Illustration</title>

  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      margin: 1.5rem;
      background: #ffffff;
    }

    .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    border: 0;
    }


    .diagram-wrap {
      border: 1px solid #ccc;
      padding: 1rem;
      border-radius: .75rem;
      background: #fafafa;
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.25rem;
      margin-top: 0;
    }

    #label-instructions {
      font-size: 0.95rem;
      color: #374151;
      margin-bottom: 0.75rem;
    }

    .lang-toggle {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .lang-toggle[hidden] {
      display: none;
    }

    .lang-toggle button {
      padding: 0.3rem 0.6rem;
      border-radius: 0.4rem;
      border: 1px solid #bbb;
      background: #ffffff;
      cursor: pointer;
      font-size: 0.85rem;
      min-height: 36px;
    }

    .lang-toggle button[aria-pressed="true"] {
      background: #e8e8e8;
      font-weight: 600;
    }

    .toggles {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .toggles button {
      padding: 0.4rem 0.6rem;
      border-radius: 0.4rem;
      border: 1px solid #bbb;
      background: #ffffff;
      cursor: pointer;
      font-size: 0.9rem;
      min-height: 44px;
      min-width: 44px;
    }

    .toggles button[aria-pressed="true"] {
      background: #e8e8e8;
      font-weight: 600;
    }

    .toggles button[aria-pressed="false"] {
      opacity: 0.6;
    }

    .toggles button:focus-visible {
      outline: 2px solid #2563eb;
      outline-offset: 2px;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
      max-height: 60vh;   /* tune: leaves room for the header, controls and caption */
    }

    @supports (height: 1dvh) {
      svg { max-height: 70dvh; }
    }

    .is-hidden {
      display: none;
    }

    .label-bg {
      fill: white;
      stroke: #000;
      stroke-width: 1;
    }

    .label {
      font-family: system-ui, sans-serif;
      font-weight: 600;
    }

    #loading-message {
    font-size: 0.9rem;
    color: #6b7280; /* subtle gray */
    animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
    0%   { opacity: 0.4; }
    50%  { opacity: 1; }
    100% { opacity: 0.4; }
    }

    .load-error {
      font-size: 0.9rem;
      color: #7a2e00;
      background: #fff3e0;
      border: 1px solid #f0c38a;
      border-radius: 0.5rem;
      padding: 0.5rem 0.75rem;
      margin-bottom: 0.75rem;
      align-items: center;
      gap: 0.75rem;
    }

    .load-error:not([hidden]) {
      display: flex;
    }

    .load-error button {
      border: 1px solid #b06a1a;
      background: #fff;
      border-radius: 0.4rem;
      padding: 0.25rem 0.6rem;
      cursor: pointer;
      min-height: 32px;
    }

  </style>
</head>
<body>
  <div id="sr-status" aria-live="polite" class="sr-only"></div>

  <div class="diagram-wrap">
    <div class="lang-toggle" role="group" aria-label="Language" id="lang-toggle" hidden></div>

    <header>
      <h1 id="diagram-title">Loading illustration…</h1>
      <p id="diagram-desc"></p>
    </header>

    <p id="label-instructions">
      Use the controls below to interact with the anatomical illustration.
    </p>

    <p id="load-error" class="load-error" hidden>
      <span id="load-error-message">Couldn't load the latest activity data from the Sheet. Showing default content instead.</span>
      <button type="button" id="retry-load">Retry</button>
    </p>

    <!-- Parallel HTML toolbar for accessibility; populated by app.js based on ?mode= -->
    <div class="toggles"
         role="toolbar"
         aria-label="Illustration interactive controls"
         aria-describedby="label-instructions"
         id="toolbar-container">
      <span id="loading-message">Loading activity data…</span>
    </div>

    <!-- Dynamic SVG target; app.js injects ./assets/prepared/{diagram}.svg here at runtime -->
    <main id="svg-container" aria-live="polite"></main>
  </div>

  <script src="app.js"></script>
</body>
</html>
